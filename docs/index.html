<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Credit Radar — CDS 스프레드 추적</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#131A22; --ink-2:#4A555F; --ink-3:#7B858E;
    --paper:#E4E7EA; --card:#F8F9FA; --rule:#C6CDD4;
    --wide:#A8322A;      /* 확대 = 나쁨 */
    --tight:#136457;     /* 축소 = 좋음 */
    --watch:#A97612;     /* 관망 */
    --proxy:#42566F;     /* 대리지표 */
    --shadow:0 1px 0 rgba(19,26,34,.06), 0 8px 24px -18px rgba(19,26,34,.5);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:Inter,system-ui,-apple-system,"Malgun Gothic",sans-serif;
    font-size:15px; line-height:1.55;
    padding:clamp(16px,4vw,44px) clamp(14px,4vw,32px) 64px;
  }
  .wrap{max-width:960px;margin:0 auto}
  .mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

  /* ── 헤더 ── */
  header{border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:6px}
  .eyebrow{font-family:Archivo,sans-serif;font-weight:700;font-size:11px;
    letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3)}
  h1{font-family:Archivo,sans-serif;font-weight:800;font-size:clamp(30px,6.2vw,50px);
    line-height:1.02;letter-spacing:-.022em;margin:.18em 0 .1em}
  .sub{color:var(--ink-2);font-size:14px;max-width:56ch}
  .stamp{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;
    font-size:11.5px;letter-spacing:.06em;color:var(--ink-3);text-transform:uppercase}
  .stamp b{color:var(--ink);font-weight:600}

  /* ── 판정 스트립 ── */
  .verdict{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
    padding:16px 0 20px;border-bottom:1px solid var(--rule);margin-bottom:26px}
  .verdict .word{font-family:Archivo,sans-serif;font-weight:800;
    font-size:clamp(20px,4.4vw,30px);letter-spacing:-.015em}
  .verdict .why{color:var(--ink-2);font-size:13.5px}

  /* ── 섹션 ── */
  section{margin-bottom:34px}
  .shead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    border-bottom:1px solid var(--ink);padding-bottom:7px;margin-bottom:16px}
  .shead h2{font-family:Archivo,sans-serif;font-weight:700;font-size:14px;
    letter-spacing:.12em;text-transform:uppercase;margin:0}
  .shead span{font-size:11.5px;color:var(--ink-3);letter-spacing:.05em}

  /* ── 온도계(시그니처) ── */
  .gauge{background:var(--card);border:1px solid var(--rule);border-radius:3px;
    padding:16px 18px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
  .grow{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .gname{font-family:Archivo,sans-serif;font-weight:700;font-size:19px;letter-spacing:-.01em}
  .badge{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
    padding:2px 6px;border-radius:2px;vertical-align:2px;margin-left:8px}
  .b-traded{background:#DDE3E9;color:var(--proxy)}
  .b-proxy{background:transparent;color:var(--proxy);border:1px dashed var(--proxy)}
  .gval{text-align:right;white-space:nowrap}
  .gval .n{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:23px;
    font-variant-numeric:tabular-nums}
  .gval .d{font-family:"JetBrains Mono",monospace;font-size:12.5px;margin-left:7px}
  .up{color:var(--wide)} .down{color:var(--tight)} .flat{color:var(--ink-3)}

  .track{position:relative;height:8px;background:#DCE1E6;border-radius:0;margin:13px 0 5px}
  .fill{position:absolute;left:0;top:0;bottom:0}
  .tick{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
  .scale{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-3);
    letter-spacing:.04em}

  .gmeta{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:11px;padding-top:11px;
    border-top:1px dotted var(--rule);font-size:12.5px;color:var(--ink-2)}
  .gmeta .k{color:var(--ink-3);text-transform:uppercase;font-size:10.5px;
    letter-spacing:.1em;margin-right:6px}
  .gnote{margin-top:8px;font-size:12.5px;color:var(--ink-2);line-height:1.5}
  .spark{display:block;margin-top:10px}

  /* ── 차트 ── */
  .chart{background:var(--card);border:1px solid var(--rule);border-radius:3px;
    padding:14px 8px 6px;box-shadow:var(--shadow)}
  .legend{display:flex;flex-wrap:wrap;gap:8px 18px;padding:8px 12px 4px;font-size:12px}
  .legend i{display:inline-block;width:16px;height:3px;vertical-align:3px;margin-right:6px}

  /* ── 실측 트렌드 ── */
  .trend{background:var(--card);border:1px solid var(--rule);border-radius:3px;
    padding:14px 16px 10px;margin-bottom:12px;box-shadow:var(--shadow)}
  .trend .grow{align-items:flex-start}
  .tmeta{display:flex;flex-wrap:wrap;gap:4px 16px;margin:6px 0 4px;font-size:12.5px;color:var(--ink-2)}
  .tmeta .k{color:var(--ink-3);text-transform:uppercase;font-size:10.5px;letter-spacing:.1em;margin-right:5px}
  .alertbadge{font-size:10.5px;font-weight:700;letter-spacing:.08em;padding:2px 7px;border-radius:2px;
    background:#C4562B;color:#fff;vertical-align:3px;margin-left:8px}
  .tchart{margin-top:6px}
  .tchart svg{display:block;width:100%;height:auto}
  details.obs{margin-top:6px;font-size:12.5px;color:var(--ink-2)}
  details.obs summary{cursor:pointer;color:var(--ink-3);font-size:11.5px;letter-spacing:.05em}
  details.obs ol{list-style:none;margin:6px 0 2px;padding:0}
  details.obs li{display:flex;gap:12px;padding:4px 0;border-bottom:1px dotted var(--rule)}
  details.obs li .mono{min-width:88px}

  /* ── 뉴스 ── */
  ul.news{list-style:none;margin:0;padding:0}
  ul.news li{padding:9px 0;border-bottom:1px dotted var(--rule);font-size:13.5px}
  ul.news a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--rule)}
  ul.news a:hover{border-color:var(--ink)}
  ul.news .who{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-3);margin-right:9px}
  .hint{color:var(--wide);font-weight:600}

  footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--rule);
    font-size:12px;color:var(--ink-3);line-height:1.65}
  footer code{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--ink-2)}
  .err{padding:20px;border:1px solid var(--wide);color:var(--wide);border-radius:3px}
  a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--proxy);outline-offset:2px}
  @media (prefers-reduced-motion:no-preference){
    .gauge{animation:rise .45s cubic-bezier(.2,.7,.3,1) backwards}
    @keyframes rise{from{opacity:0;transform:translateY(7px)}}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Credit Desk · AI Infrastructure</div>
    <h1>AI 크레딧 레이더</h1>
    <p class="sub">엔비디아 · 오라클 · 코어위브 · OpenAI · 앤트로픽의 부도보험 가격과 신용 스트레스를 매일 추적합니다.</p>
    <div class="stamp" id="stamp"></div>
  </header>

  <div class="verdict" id="verdict"></div>

  <section>
    <div class="shead"><h2>실측 CDS 트렌드</h2><span>오라클·코어위브 5Y · 기준선</span></div>
    <div id="trends"></div>
  </section>

  <section>
    <div class="shead"><h2>스프레드 온도계</h2><span>실측 CDS 레인지 · 일간 스트레스 지수</span></div>
    <div id="gauges"></div>
  </section>

  <section>
    <div class="shead"><h2>실측 5Y CDS 궤적</h2><span>보도 기준 관측치 · bp</span></div>
    <div class="chart"><div id="cdschart"></div><div class="legend" id="cdslegend"></div></div>
  </section>

  <section>
    <div class="shead"><h2>시장 전체 대비</h2><span>ICE BofA BBB OAS · FRED</span></div>
    <div class="chart"><div id="macrochart"></div><div class="legend" id="macronote"></div></div>
  </section>

  <section>
    <div class="shead"><h2>신규 수치 후보</h2><span>최근 7일 보도 · 시드 갱신용</span></div>
    <ul class="news" id="news"></ul>
  </section>

  <footer id="foot"></footer>
</div>

<script>
const PAL = {oracle:"#A8322A", nvidia:"#A97612", openai:"#42566F", anthropic:"#136457"};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function bandOf(v){
  if (v >= 75) return {c:"var(--wide)",  t:"과열"};
  if (v >= 60) return {c:"#C4562B",      t:"확대"};
  if (v >= 40) return {c:"var(--watch)", t:"관망"};
  return {c:"var(--tight)", t:"안정"};
}
function delta(cur, prev){
  if (prev == null) return {cls:"flat", txt:"―"};
  const d = cur - prev;
  if (d >= 0.5)  return {cls:"up",   txt:"▲" + d.toFixed(1)};
  if (d <= -0.5) return {cls:"down", txt:"▼" + Math.abs(d).toFixed(1)};
  return {cls:"flat", txt:"― 0.0"};
}

/* 의존성 없는 SVG 라인차트 */
function lineChart(el, seriesList, opt){
  const W = 900, H = opt.height || 260, P = {t:14, r:52, b:26, l:44};
  const all = seriesList.flatMap(s => s.pts);
  if (!all.length){ el.innerHTML = '<p style="padding:14px;color:var(--ink-3)">데이터 없음</p>'; return; }
  const xs = all.map(p => p[0]), ys = all.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  const pad = (y1 - y0) * 0.12 || 1; y0 -= pad; y1 += pad;
  if (opt.zeroFloor) y0 = Math.max(0, y0);
  const sx = v => P.l + (x1 === x0 ? 0 : (v - x0) / (x1 - x0)) * (W - P.l - P.r);
  const sy = v => H - P.b - (v - y0) / (y1 - y0) * (H - P.t - P.b);

  let g = "";
  for (let i = 0; i <= 4; i++){
    const v = y0 + (y1 - y0) * i / 4, y = sy(v);
    g += `<line x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}" stroke="var(--rule)" stroke-width="1" ${i?'stroke-dasharray="2 4"':''}/>`
       + `<text x="${P.l-8}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--ink-3)" font-family="JetBrains Mono">${Math.round(v)}</text>`;
  }
  const fmt = t => { const d = new Date(t); return String(d.getMonth()+1).padStart(2,"0") + "/" + String(d.getDate()).padStart(2,"0"); };
  [x0, (x0+x1)/2, x1].forEach((t, i) => {
    g += `<text x="${sx(t)}" y="${H-7}" text-anchor="${i===0?"start":i===2?"end":"middle"}" font-size="11" fill="var(--ink-3)" font-family="JetBrains Mono">${fmt(t)}</text>`;
  });

  for (const s of seriesList){
    const d = s.pts.map((p, i) => (i ? "L" : "M") + sx(p[0]).toFixed(1) + " " + sy(p[1]).toFixed(1)).join(" ");
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width||2.2}" stroke-linejoin="round" stroke-linecap="round" ${s.dash?'stroke-dasharray="5 4"':''}/>`;
    if (s.dots) for (const p of s.pts) g += `<circle cx="${sx(p[0])}" cy="${sy(p[1])}" r="3" fill="${s.color}"/>`;
    const last = s.pts[s.pts.length-1];
    g += `<text x="${W-P.r+7}" y="${sy(last[1])+4}" font-size="11.5" font-weight="700" fill="${s.color}" font-family="JetBrains Mono">${Math.round(last[1])}</text>`;
  }
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="${esc(opt.label||"차트")}">${g}</svg>`;
}

/* 실측 CDS 추세 + 기준선 — 실제 픽셀 폭으로 그려 모바일에서도 글자가 작아지지 않게 */
const TPAL = {oracle:"#A8322A", coreweave:"#42566F"};
const ALERT_C = "#C4562B", DAY = 864e5;
function trendChart(el, m, color){
  const W = Math.max(300, Math.round(el.clientWidth || 860));
  const H = W < 560 ? 230 : 260, P = {t:18, r:W < 560 ? 62 : 74, b:26, l:W < 560 ? 44 : 54};
  const pts = m.series.map(([dt, v]) => [Date.parse(dt + "T00:00:00Z"), +v]);
  const lines = m.baselines || [];
  const now = new Date(Date.now() + 9 * 3600e3);                      // KST 날짜
  const today = Date.parse(now.toISOString().slice(0, 10) + "T00:00:00Z");
  const x0 = pts[0][0] - 7 * DAY, x1 = Math.max(today, pts[pts.length - 1][0]) + 12 * DAY;
  const vals = pts.map(p => p[1]).concat(lines.map(b => b.bp));
  let y0 = Math.min(...vals), y1 = Math.max(...vals);
  const pad = (y1 - y0) * 0.1 || 10; y0 = Math.max(0, y0 - pad); y1 += pad;
  // 눈금은 1·2·2.5·5×10^k 단위로 반올림 (322·272 같은 어색한 값 방지)
  const raw = (y1 - y0) / 4, p10 = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p10;
  const ystep = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p10;
  y0 = Math.floor(y0 / ystep) * ystep; y1 = Math.ceil(y1 / ystep) * ystep;
  const sx = t => P.l + (t - x0) / (x1 - x0) * (W - P.l - P.r);
  const sy = v => H - P.b - (v - y0) / (y1 - y0) * (H - P.t - P.b);
  const mono = 'font-family="JetBrains Mono"';
  let g = "";
  for (let v = y0, i = 0; v <= y1 + 1e-9; v += ystep, i++){
    const y = sy(v);
    g += `<line x1="${P.l}" x2="${W - P.r}" y1="${y}" y2="${y}" stroke="var(--rule)" ${i ? 'stroke-dasharray="2 4"' : ""}/>`
       + `<text x="${P.l - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="var(--ink-3)" ${mono}>${Math.round(v).toLocaleString()}</text>`;
  }
  // 월 눈금 — 간격이 좁으면 격월
  const months = [];
  for (let d = new Date(x0), t = Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1); t < x1;){
    months.push(t); const n = new Date(t); t = Date.UTC(n.getUTCFullYear(), n.getUTCMonth() + 1, 1);
  }
  const step = months.length > 1 && (sx(months[1]) - sx(months[0])) < 34 ? 2 : 1;
  months.forEach((t, i) => { if (i % step) return;
    g += `<text x="${sx(t)}" y="${H - 7}" text-anchor="middle" font-size="11" fill="var(--ink-3)">${new Date(t).getUTCMonth() + 1}월</text>`; });
  // 기준선
  for (const b of lines){
    const y = sy(b.bp), alert = b.kind === "alert", c = alert ? ALERT_C : "var(--ink-3)";
    g += `<line x1="${P.l}" x2="${W - P.r}" y1="${y}" y2="${y}" stroke="${c}" stroke-width="${alert ? 1.6 : 1.1}" stroke-dasharray="${alert ? "7 5" : "2 4"}"><title>${esc(b.source)}</title></line>`
       + `<text x="${P.l + 6}" y="${y - 5}" font-size="11" fill="${c}" font-weight="${alert ? 700 : 400}">${esc(b.label)} ${Math.round(b.bp).toLocaleString()}</text>`;
  }
  // 오늘
  const tx = sx(today);
  g += `<line x1="${tx}" x2="${tx}" y1="${P.t}" y2="${H - P.b}" stroke="var(--ink-3)" stroke-dasharray="1 3"/>`
     + `<text x="${tx + 4}" y="${P.t + 9}" font-size="10.5" fill="var(--ink-3)">오늘</text>`;
  // 추세 — 30일 넘는 관측 공백은 옅은 점선 (보간 아님)
  for (let i = 1; i < pts.length; i++){
    const far = (pts[i][0] - pts[i - 1][0]) / DAY > 30;
    g += `<line x1="${sx(pts[i-1][0])}" y1="${sy(pts[i-1][1])}" x2="${sx(pts[i][0])}" y2="${sy(pts[i][1])}" stroke="${color}" stroke-width="${far ? 1.4 : 2.4}" stroke-linecap="round" ${far ? 'stroke-dasharray="4 4" opacity=".55"' : ""}/>`;
  }
  m.series.forEach(([dt, v, src], i) => {
    const last = i === pts.length - 1;
    g += `<circle cx="${sx(pts[i][0])}" cy="${sy(v)}" r="${last ? 5.5 : 3.4}" fill="${color}" stroke="var(--card)" stroke-width="1.5"><title>${esc(dt)} · ${(+v).toLocaleString()}bp · ${esc(src)}</title></circle>`;
  });
  const L = pts[pts.length - 1], nearTop = sy(L[1]) < P.t + 30;
  g += `<text x="${sx(L[0]) + 9}" y="${sy(L[1]) + (nearTop ? 18 : -8)}" font-size="13" font-weight="700" fill="${color}" ${mono}>${Math.round(L[1]).toLocaleString()}bp</text>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(m.name)} 5년 CDS 추세와 기준선">${g}</svg>`;
}

function renderTrends(d){
  const box = $("#trends"), ms = d.measured || [];
  if (!ms.length){ box.innerHTML = '<p style="color:var(--ink-3)">실측 시계열 없음.</p>'; return; }
  const md = s => s ? s.slice(5).replace("-", "/") : "?";
  box.innerHTML = ms.map(m => {
    const dl = m.chg == null ? {cls:"flat", txt:"―"} : m.chg > 0 ? {cls:"up", txt:"▲" + Math.round(m.chg).toLocaleString()}
             : m.chg < 0 ? {cls:"down", txt:"▼" + Math.round(-m.chg).toLocaleString()} : {cls:"flat", txt:"―"};
    const alertTxt = m.alert_bp == null ? "" : m.alert
      ? `<span class="alertbadge">경보선 ${Math.round(m.alert_bp).toLocaleString()} 돌파</span>` : "";
    const toAlert = m.alert_bp == null || m.alert ? "" :
      `<span><span class="k">경보선까지</span><b class="mono">${Math.round(m.to_alert).toLocaleString()}bp</b> <span style="color:var(--ink-3)">(${Math.round(m.alert_bp).toLocaleString()})</span></span>`;
    const rows = [...m.series].reverse().map(([dt, v, src]) =>
      `<li><span class="mono">${esc(dt)}</span><b class="mono">${(+v).toLocaleString()}bp</b><span>${esc(src)}</span></li>`).join("");
    return `<article class="trend">
      <div class="grow">
        <div><span class="gname">${esc(m.name)}</span>${alertTxt}</div>
        <div class="gval"><span class="n" style="color:${TPAL[m.key] || "var(--ink)"}">${Math.round(m.last).toLocaleString()}<small style="font-size:13px">bp</small></span>
          <span class="d ${dl.cls}">${dl.txt}</span></div>
      </div>
      <div class="tmeta">
        <span><span class="k">최신</span>${md(m.last_date)} 보도${m.age_days > 0 ? ` <span style="color:var(--ink-3)">(${m.age_days}일 전)</span>` : ""}</span>
        ${m.prev != null ? `<span><span class="k">직전</span>${md(m.prev_date)} ${Math.round(m.prev).toLocaleString()}bp</span>` : ""}
        <span><span class="k">연중 최고</span>${Math.round(m.high).toLocaleString()}bp (${md(m.high_date)})</span>
        ${toAlert}
      </div>
      <div class="tchart" data-key="${esc(m.key)}"></div>
      <details class="obs"><summary>관측치 ${m.series.length}건 · 출처</summary><ol>${rows}</ol></details>
    </article>`;
  }).join("");
  const draw = () => ms.forEach(m => {
    const el = box.querySelector(`.tchart[data-key="${m.key}"]`);
    if (el) trendChart(el, m, TPAL[m.key] || "var(--ink)");
  });
  draw();
  let tm; window.addEventListener("resize", () => { clearTimeout(tm); tm = setTimeout(draw, 150); });
}

function sparkline(pts, color){
  const W = 300, H = 34;
  if (pts.length < 2) return "";
  const ys = pts.map(p => p[1]), y0 = Math.min(...ys), y1 = Math.max(...ys) || 1;
  const d = pts.map((p, i) =>
    (i ? "L" : "M") + (i / (pts.length - 1) * W).toFixed(1) + " " +
    (H - 3 - (p[1] - y0) / ((y1 - y0) || 1) * (H - 6)).toFixed(1)).join(" ");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}

function render(d){
  $("#stamp").innerHTML =
    `<span>기준 <b>${esc(d.asof)}</b> 종가</span>` +
    `<span>갱신 <b>${esc((d.generated_at||"").replace("T"," ").slice(0,16))}</b> KST</span>` +
    `<span>추적 <b>${d.entities.length}</b>개 축</span>`;

  const rising = d.entities.filter(e => e.csi > (e.csi_prev ?? e.csi)).length;
  const worst = [...d.entities].sort((a,b) => b.csi - a.csi)[0];
  const vb = bandOf(worst.csi);
  const stale = (Date.now()-Date.parse(d.asof+"T00:00:00+09:00"))/86400000 >= 4;
  const falling = d.entities.filter(e => e.csi_prev != null && e.csi < e.csi_prev).length;
  const word = stale || (d.quality_warnings||[]).length ? "최신 판단 보류" : rising >= 3 ? "확대 국면" : falling === d.entities.length ? "진정 국면" : "혼조";
  const breached = (d.measured || []).filter(m => m.alert).map(m => m.name);
  $("#verdict").innerHTML =
    `<span class="word" style="color:${vb.c}">${word}</span>` +
    `<span class="why">${d.entities.length}축 중 ${rising}축 상승 · 최고 스트레스는 <b>${esc(worst.name)}</b> ${worst.csi.toFixed(1)}` +
    (d.macro && d.macro.bbb_oas_bp != null
      ? ` · BBB OAS ${Math.round(d.macro.bbb_oas_bp)}bp(2년 백분위 ${Math.round(d.macro.percentile_2y*100)}%)` : "") +
    (breached.length ? ` · <b style="color:${ALERT_C}">실측 경보: ${esc(breached.join(", "))}</b>` : "") + `</span>`;

  renderTrends(d);

  // 온도계
  $("#gauges").innerHTML = d.entities.map((e, i) => {
    const b = bandOf(e.csi), dl = delta(e.csi, e.csi_prev), c = e.cds || {};
    const col = PAL[e.key] || "var(--proxy)";
    let rangeRow = "";
    if (c.last != null && c.ytd_high){
      const lo = Math.min(c.ytd_low, c.last), hi = Math.max(c.ytd_high, c.last);
      if (hi === lo){
        rangeRow = `
        <div class="track" role="img" aria-label="관측 1건 ${lo}bp">
          <div class="tick" style="left:calc(50% - 1px);background:${col}"></div>
        </div>
        <div class="scale mono"><span></span><span>관측 1건 · ${lo}bp</span><span></span></div>`;
      } else {
      const pos = (c.last - lo) / (hi - lo) * 100;
      rangeRow = `
        <div class="track" role="img" aria-label="CDS 레인지 ${lo}~${hi}bp, 현재 ${c.last}bp">
          <div class="fill" style="width:${pos.toFixed(1)}%;background:${col};opacity:.25"></div>
          <div class="tick" style="left:calc(${pos.toFixed(1)}% - 1px);background:${col}"></div>
        </div>
        <div class="scale mono"><span>${lo}bp</span><span>관측 레인지</span><span>${hi}bp</span></div>`;
      }
    }
    return `<article class="gauge" style="animation-delay:${i*60}ms">
      <div class="grow">
        <div>
          <span class="gname">${esc(e.name)}</span>
          <span class="badge ${e.type==="traded"?"b-traded":"b-proxy"}">${e.type==="traded"?"CDS 거래":"대리지표"}</span>
        </div>
        <div class="gval">
          <span class="n" style="color:${b.c}">${e.csi.toFixed(1)}</span>
          <span class="d ${dl.cls}">${dl.txt}</span>
        </div>
      </div>
      ${rangeRow}
      ${sparkline(e.csi_hist.slice(-120), col)}
      <div class="gmeta">
        <span><span class="k">실측 CDS</span><b class="mono">${c.last != null ? c.last + "bp" : "—"}</b>
          ${c.last_date ? `<span style="color:var(--ink-3)"> @${esc(c.last_date)}</span>` : ""}</span>
        <span><span class="k">스트레스</span>${b.t}</span>
        <span><span class="k">구성</span><span class="mono">${Object.entries(e.basket).map(([t,w])=>`${t} ${Math.round(w*100)}%`).join(" · ")}</span></span>
      </div>
      <p class="gnote">${esc(e.note)}${c.source ? ` <span style="color:var(--ink-3)">출처: ${esc(c.source)}</span>` : ""}</p>
    </article>`;
  }).join("");

  // CDS 궤적
  const cdsSeries = d.entities
    .filter(e => (e.cds.series || []).length >= 2)
    .map(e => ({
      name: e.name + (e.type === "proxy" ? " (대리)" : ""),
      color: PAL[e.key] || "var(--proxy)",
      dash: e.type === "proxy", dots: true,
      pts: e.cds.series.map(([dt, v]) => [Date.parse(dt), v])
    }));
  // 855bp(CoreWeave)는 축을 뭉갠다 — 별도 표기하고 주축에서 제외
  const off = cdsSeries.filter(s => Math.max(...s.pts.map(p=>p[1])) > 400);
  lineChart($("#cdschart"), cdsSeries.filter(s => !off.includes(s)), {label:"5년 CDS 궤적", zeroFloor:true});
  $("#cdslegend").innerHTML =
    cdsSeries.filter(s=>!off.includes(s)).map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("") +
    off.map(s => `<span style="color:var(--ink-3)"><i style="background:${s.color};opacity:.5"></i>${esc(s.name)} ${Math.round(s.pts[s.pts.length-1][1]).toLocaleString()}bp — 코어위브 값, 축 스케일 밖이라 위 트렌드 차트 참조</span>`).join("");

  // 매크로
  const m = d.macro || {};
  if ((m.series || []).length > 2){
    lineChart($("#macrochart"), [{name:"BBB OAS", color:"var(--proxy)", width:1.8,
      pts:m.series.map(([dt,v]) => [Date.parse(dt), v])}], {height:170, label:"BBB OAS"});
    const p = Math.round((m.percentile_2y||0)*100);
    $("#macronote").innerHTML = `<span>${p < 50
      ? "투자등급 지수는 2년 평균보다 <b>타이트</b> — 스트레스가 개별 AI 이름에 국한돼 있습니다."
      : "투자등급 지수까지 <b>확대</b> — 개별 이슈를 넘어 시스템 전이 가능성을 점검하세요."}
      (현재 ${Math.round(m.bbb_oas_bp)}bp, 2년 백분위 ${p}%)</span>`;
  }

  // 뉴스
  const n = (d.candidates || []).slice(0, 12);
  $("#news").innerHTML = n.length ? n.map(c => `<li>
      <span class="who">${esc(c.entity)}</span>
      <a href="${esc(c.link)}" target="_blank" rel="noopener">${esc(c.title)}</a>
      ${c.bp_hint ? `<span class="hint mono"> ${c.bp_hint}bp</span>` : ""}
    </li>`).join("")
    : `<li style="color:var(--ink-3)">최근 7일 신규 보도 없음.</li>`;

  $("#foot").innerHTML =
    `<b>읽는 법</b> — 실측 CDS는 무료 실시간 피드가 없어 <code>cds_seed.json</code>에 보도 기준으로 큐레이션합니다.
     매일 움직이는 값은 주가·매크로에서 산출한 스트레스 지수(CSI)이며, CDS 호가가 아닙니다.<br>
     <b>CSI 산식</b> — <code>${esc((d.method||{}).csi || "")}</code><br>
     <b>대리지표</b> — OpenAI·앤트로픽은 단일종목 CDS가 없습니다. 위험이 전가된 상장 보증인의 크레딧으로 읽습니다(OpenAI 실측 = 코어위브).<br>
     <b>기준선</b> — 트렌드 차트의 참고선·경보선은 <code>cds_seed.json</code>의 <code>_baselines</code>에서 바꿉니다. 경보선 돌파 시 브리프에 표시됩니다.
     점은 보도 기준 관측치이고, 30일 넘게 관측이 빈 구간은 옅은 점선(보간 아님)입니다.<br>
     소스: yfinance · FRED(ICE BofA) · Google News RSS. 투자 판단의 책임은 이용자에게 있습니다.`;
}

fetch("./data.json?v=" + Date.now())
  .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(render)
  .catch(e => { $("#gauges").innerHTML =
    `<div class="err">데이터를 불러오지 못했습니다 (${esc(e.message)}). 수집 워크플로우가 <code>docs/data.json</code>을 커밋했는지 확인하세요.</div>`; });
</script>
</body>
</html>
