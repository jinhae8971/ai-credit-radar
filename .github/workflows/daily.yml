name: AI Credit Radar Daily

on:
  schedule:
    - cron: "30 22 * * *"      # UTC 22:30 = KST 07:30 (매일)
  workflow_dispatch:
    inputs:
      skip_notify:
        description: "텔레그램 발송 없이 데이터만 갱신 (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: ai-credit-radar
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  run:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt

      - name: Collect
        env:
          TZ: "Asia/Seoul"
        run: |
          set -euo pipefail
          python collect.py

      - name: Commit data
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "data: $(date -u +%Y-%m-%d) 갱신"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase --autostash origin "${BRANCH}"
            sleep $((i * 5))
          done
          echo "::error::3회 시도 후에도 푸시 실패"; exit 1

      - name: Notify
        if: ${{ inputs.skip_notify != 'true' }}
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGES_URL:        ${{ vars.PAGES_URL }}
          TZ: "Asia/Seoul"
        run: |
          set -euo pipefail
          python notify.py

      - name: Notify failure
        if: failure()
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=$(printf '%s\n%s' '❌ AI 크레딧 레이더 실행 실패' "${RUN_URL}")" \
            || true
